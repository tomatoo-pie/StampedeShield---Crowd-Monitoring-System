services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      PROCESSED_DIR: /app/data/processed
      MODEL_PATH: ${MODEL_PATH:-/models/yolov8n.pt}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-75}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-300}
    volumes:
      - video-data:/app/data
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      PROCESSED_DIR: /app/data/processed
      MODEL_PATH: ${MODEL_PATH:-/models/yolov8n.pt}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-75}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-300}
    volumes:
      - video-data:/app/data
      - ${MODEL_DIR:-./models}:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  video-data:
